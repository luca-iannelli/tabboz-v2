name: Windows native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resource tests and generation
        run: |
          python -m unittest discover -s tests -v
          python tools/generate_resources.py
      - name: Build and native integration tests
        shell: powershell
        run: ./tools/build-windows.ps1
      - name: Fetch pinned local installer compiler
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg -OutFile .tools/inno.zip
          $hash=[BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([IO.File]::ReadAllBytes("$pwd/.tools/inno.zip"))).Replace('-','').ToLower()
          if($hash -ne 'f780898e402ff80612cc8d9fcb8c6e02932bd1cb4c900ffdaa31f9341cfb49f4'){throw 'Installer compiler checksum mismatch'}
          Expand-Archive .tools/inno.zip .tools/inno
      - name: Package installer, portable executable and corresponding source
        shell: powershell
        run: |
          python tools/source_archive.py
          ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: TabbozSimulator-Windows-x64
          path: dist/*
          if-no-files-found: error
